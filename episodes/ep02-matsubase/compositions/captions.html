<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    .cap { position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; }
    .cap span {
      display: inline-block; font-family: "Gothic A1", sans-serif; font-weight: 500;

  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap clip" data-start="0.4" data-duration="2.81"><span>"범행 뒤 목욕 아궁이에서 태워 버렸다"</span></div><div id="cap-1" class="cap clip" data-start="3.41" data-duration="3.2"><span>1985년, 한 남자의 조서에 담긴 진술입니다</span></div><div id="cap-2" class="cap clip" data-start="6.81" data-duration="3.07"><span>그런데 그가 태웠다던 셔츠 소매는 남아 있었죠</span></div><div id="cap-3" class="cap clip" data-start="10.58" data-duration="2.94"><span>1985년 1월 8일 오전 9시 30분 무렵</span></div><div id="cap-4" class="cap clip" data-start="13.72" data-duration="2.94"><span>일본 구마모토현 시모마시키군 마쓰바세정</span></div><div id="cap-5" class="cap clip" data-start="16.86" data-duration="2.16"><span>지금은 우키시에 속한 곳이죠</span></div><div id="cap-6" class="cap clip" data-start="19.22" data-duration="2.94"><span>59세 남성이 자기 집 방 안에서 발견됩니다</span></div><div id="cap-7" class="cap clip" data-start="22.36" data-duration="2.68"><span>흉기에 여러 차례 찔려 숨져 있었습니다</span></div><div id="cap-8" class="cap clip" data-start="25.74" data-duration="2.81"><span>방에는 겨울 난방 탁자, 고타츠가 있었죠</span></div><div id="cap-9" class="cap clip" data-start="28.75" data-duration="2.81"><span>고타츠 한쪽 구석엔 빨간 망에 든 귤 19개</span></div><div id="cap-10" class="cap clip" data-start="31.76" data-duration="2.94"><span>상판 위엔 귤 한 개를 먹은 흔적이 있었습니다</span></div><div id="cap-11" class="cap clip" data-start="34.9" data-duration="2.68"><span>숨진 날은 1월 6일 무렵으로 인정됐죠</span></div><div id="cap-12" class="cap clip" data-start="38.28" data-duration="2.81"><span>그런데 이 사건엔 이상한 점이 있었습니다</span></div><div id="cap-13" class="cap clip" data-start="41.29" data-duration="2.68"><span>범인을 특정할 장면을 본 사람은 없었고</span></div><div id="cap-14" class="cap clip" data-start="44.17" data-duration="2.55"><span>범인을 가리키는 다른 증거도 없었죠</span></div><div id="cap-15" class="cap clip" data-start="46.92" data-duration="2.94"><span>남은 것은 한 남자의 자백 하나뿐이었습니다</span></div><div id="cap-16" class="cap clip" data-start="50.06" data-duration="3.07"><span>결국 살인 등의 죄로 징역 13년형이 확정되죠</span></div><div id="cap-17" class="cap clip" data-start="53.83" data-duration="2.16"><span>이 사건의 결론이 나오기까지</span></div><div id="cap-18" class="cap clip" data-start="56.19" data-duration="2.1"><span>무려 34년이 걸렸습니다</span></div><div id="cap-19" class="cap clip" data-start="58.49" data-duration="2.81"><span>1985년 겨울에서 2019년 봄까지</span></div><div id="cap-20" class="cap clip" data-start="61.5" data-duration="3.07"><span>그사이 50대 초반이던 그는 85세가 됩니다</span></div><div id="cap-21" class="cap clip" data-start="65.27" data-duration="2.29"><span>사흘 전으로 되돌려 보겠습니다</span></div><div id="cap-22" class="cap clip" data-start="67.76" data-duration="2.1"><span>1985년 1월 5일 밤</span></div><div id="cap-23" class="cap clip" data-start="70.06" data-duration="3.2"><span>피해자와 장기 친구들, 모두 넷이 술을 마십니다</span></div><div id="cap-24" class="cap clip" data-start="73.46" data-duration="3.2"><span>한 친구 집에서 마시다가 피해자의 집으로 옮겼죠</span></div><div id="cap-25" class="cap clip" data-start="76.86" data-duration="2.94"><span>공소장에 적힌 시각은 밤 11시 30분 무렵</span></div><div id="cap-26" class="cap clip" data-start="80.0" data-duration="2.94"><span>한 친구가 피해자와 심하게 말다툼을 벌이죠</span></div><div id="cap-27" class="cap clip" data-start="83.64" data-duration="2.1"><span>사흘 뒤 피해자가 발견되고</span></div><div id="cap-28" class="cap clip" data-start="85.94" data-duration="2.81"><span>경찰은 그날 밤부터 그 친구를 조사합니다</span></div><div id="cap-29" class="cap clip" data-start="88.95" data-duration="2.94"><span>첫날 조사는 밤 11시 56분까지 이어졌죠</span></div><div id="cap-30" class="cap clip" data-start="92.09" data-duration="3.07"><span>함께 있던 부부는 둘의 말다툼을 경찰에 말했고</span></div><div id="cap-31" class="cap clip" data-start="95.36" data-duration="3.07"><span>그 친구는 말다툼 뒤 집에 갔을 뿐이라 했습니다</span></div><div id="cap-32" class="cap clip" data-start="99.13" data-duration="2.1"><span>그 친구의 이름은 미야타 씨</span></div><div id="cap-33" class="cap clip" data-start="101.43" data-duration="2.94"><span>당시 50대 초반, 피해자의 장기 친구였죠</span></div><div id="cap-34" class="cap clip" data-start="104.57" data-duration="2.94"><span>집은 경찰서에서 약 300m 거리였습니다</span></div><div id="cap-35" class="cap clip" data-start="107.71" data-duration="2.55"><span>그 집 2층에는 작업장이 하나 있었죠</span></div><div id="cap-36" class="cap clip" data-start="110.46" data-duration="3.2"><span>그렇다면 경찰은 왜 그를 아홉 번이나 조사했을까</span></div><div id="cap-37" class="cap clip" data-start="114.36" data-duration="3.2"><span>1월 8일부터 10일, 12일부터 14일까지</span></div><div id="cap-38" class="cap clip" data-start="117.76" data-duration="2.94"><span>그는 체포되지 않은 채 임의 조사를 받습니다</span></div><div id="cap-39" class="cap clip" data-start="120.9" data-duration="2.81"><span>경찰은 아직 체포영장을 청구하지 못했죠</span></div><div id="cap-40" class="cap clip" data-start="123.91" data-duration="2.55"><span>범인을 가리키는 증거가 없었던 거죠</span></div><div id="cap-41" class="cap clip" data-start="126.66" data-duration="3.07"><span>15일부터 17일까지는 조사가 없었습니다</span></div><div id="cap-42" class="cap clip" data-start="129.93" data-duration="3.2"><span>자백하는 날까지 13일 가운데 조사한 날은 9일</span></div><div id="cap-43" class="cap clip" data-start="133.33" data-duration="3.2"><span>법원이 따진 조사 시간은 70시간이 넘었습니다</span></div><div id="cap-44" class="cap clip" data-start="137.23" data-duration="2.94"><span>조사실에서 그는 줄곧 범행을 부인했습니다</span></div><div id="cap-45" class="cap clip" data-start="140.37" data-duration="3.2"><span>쉬는 사흘 동안 경찰은 "집에 있어 달라"고 했죠</span></div><div id="cap-46" class="cap clip" data-start="143.77" data-duration="2.68"><span>1월 18일, 조사가 다시 시작됩니다</span></div><div id="cap-47" class="cap clip" data-start="146.65" data-duration="2.42"><span>이날 조사는 모두 13시간 42분</span></div><div id="cap-48" class="cap clip" data-start="149.27" data-duration="2.81"><span>그 오전, 그는 폴리그래프 검사를 받았죠</span></div><div id="cap-49" class="cap clip" data-start="152.78" data-duration="3.2"><span>검사는 오전 9시 10분부터 11시 37분까지</span></div><div id="cap-50" class="cap clip" data-start="156.18" data-duration="2.42"><span>경찰의 요구에 응해 받은 검사였죠</span></div><div id="cap-51" class="cap clip" data-start="158.8" data-duration="3.33"><span>담당 경찰관은 나중에 법정에서 이렇게 말했습니다</span></div><div id="cap-52" class="cap clip" data-start="162.33" data-duration="2.94"><span>범인이 자전거를 버렸다는 질문에 반응했고</span></div><div id="cap-53" class="cap clip" data-start="165.47" data-duration="3.33"><span>피해자가 귤을 먹고 있었다는 질문에도 반응했다고</span></div><div id="cap-54" class="cap clip" data-start="169.0" data-duration="3.07"><span>검사 뒤엔 결과와 말이 다르다고 추궁받습니다</span></div><div id="cap-55" class="cap clip" data-start="172.27" data-duration="2.68"><span>그래도 그날 그는 진술을 바꾸지 않았죠</span></div><div id="cap-56" class="cap clip" data-start="175.65" data-duration="2.16"><span>질문 하나는 이것이었습니다</span></div><div id="cap-57" class="cap clip" data-start="178.01" data-duration="2.55"><span>"피해자 집 고타츠에 귤이 있었다"</span></div><div id="cap-58" class="cap clip" data-start="180.76" data-duration="2.68"><span>발견 당시 고타츠에 있던 바로 그 귤이죠</span></div><div id="cap-59" class="cap clip" data-start="183.64" data-duration="2.55"><span>훗날 확정 판결은 폴리그래프 반응도</span></div><div id="cap-60" class="cap clip" data-start="186.39" data-duration="2.42"><span>자백을 믿을 만한 사정으로 들었죠</span></div><div id="cap-61" class="cap clip" data-start="189.01" data-duration="2.1"><span>그런데 자백한 뒤에도 그는</span></div><div id="cap-62" class="cap clip" data-start="191.31" data-duration="3.07"><span>고타츠 위에 뭐가 있었는지 못 봤다고 했습니다</span></div><div id="cap-63" class="cap clip" data-start="195.08" data-duration="3.07"><span>그의 진술에 따르면 귤에는 사연이 있었습니다</span></div><div id="cap-64" class="cap clip" data-start="198.35" data-duration="2.81"><span>검사 전, 경찰이 서너 번 물었다고 합니다</span></div><div id="cap-65" class="cap clip" data-start="201.36" data-duration="2.1"><span>"귤 먹지 않았느냐"고요</span></div><div id="cap-66" class="cap clip" data-start="203.66" data-duration="2.68"><span>1월 9일 무렵 조사 땐 귤이 나와 먹었고</span></div><div id="cap-67" class="cap clip" data-start="206.54" data-duration="3.2"><span>화장실에 다녀오니 귤이 없어져 불안했다는 거죠</span></div><div id="cap-68" class="cap clip" data-start="209.94" data-duration="3.07"><span>2월 8일과 9일의 조서에 남은 그의 말입니다</span></div><div id="cap-69" class="cap clip" data-start="213.71" data-duration="3.07"><span>1월 18일 밤, 경찰관이 그에게 한 말입니다</span></div><div id="cap-70" class="cap clip" data-start="216.98" data-duration="3.07"><span>"죽였다는 이야기를 한다고 한 줄 알았는데"</span></div><div id="cap-71" class="cap clip" data-start="220.25" data-duration="2.81"><span>다음 날 19일, 조사는 12시간 45분</span></div><div id="cap-72" class="cap clip" data-start="223.26" data-duration="3.2"><span>그날 그는 "부인한 채로 체포해 달라"고 합니다</span></div><div id="cap-73" class="cap clip" data-start="226.66" data-duration="3.07"><span>"체포되면 놀랄 만큼 술술 말하겠다"면서요</span></div><div id="cap-74" class="cap clip" data-start="229.93" data-duration="2.42"><span>그리고 그날 밤 그는 이렇게 말했죠</span></div><div id="cap-75" class="cap clip" data-start="232.55" data-duration="2.29"><span>"저는 이제 견딜 수 없습니다"</span></div><div id="cap-76" class="cap clip" data-start="235.54" data-duration="3.2"><span>1월 20일, 그는 경찰에 한 가지를 부탁합니다</span></div><div id="cap-77" class="cap clip" data-start="238.94" data-duration="2.94"><span>"집에서 보고 싶은 TV 프로그램이 있다"</span></div><div id="cap-78" class="cap clip" data-start="242.08" data-duration="2.81"><span>그러니 그날 조사는 쉬게 해 달라는 거였죠</span></div><div id="cap-79" class="cap clip" data-start="245.09" data-duration="3.33"><span>하지만 경찰의 설득에, 집에서 조사를 받기로 하죠</span></div><div id="cap-80" class="cap clip" data-start="248.62" data-duration="2.55"><span>전날 밤엔 집에 와도 된다고 답했고요</span></div><div id="cap-81" class="cap clip" data-start="251.37" data-duration="3.2"><span>오전 10시 무렵, 경찰이 그의 집을 찾아옵니다</span></div><div id="cap-82" class="cap clip" data-start="255.27" data-duration="2.94"><span>오전 10시 40분 무렵, 그는 자백합니다</span></div><div id="cap-83" class="cap clip" data-start="258.41" data-duration="2.68"><span>칼 한 자루를 흉기라며 경찰에 내놓았죠</span></div><div id="cap-84" class="cap clip" data-start="261.29" data-duration="3.07"><span>그날 밤 11시 3분, 살인 혐의로 체포됩니다</span></div><div id="cap-85" class="cap clip" data-start="264.56" data-duration="2.94"><span>영장은 그날의 자백을 근거로 청구됐습니다</span></div><div id="cap-86" class="cap clip" data-start="267.7" data-duration="2.42"><span>처음 조사를 받은 지 13일째였죠</span></div><div id="cap-87" class="cap clip" data-start="270.32" data-duration="2.94"><span>그렇다면 그 자백에는 무엇이 담겨 있었을까</span></div><div id="cap-88" class="cap clip" data-start="273.96" data-duration="2.55"><span>그가 낸 칼은 '기리다시 고가타나'</span></div><div id="cap-89" class="cap clip" data-start="276.71" data-duration="2.42"><span>끝이 비스듬하게 잘린 작은 칼이죠</span></div><div id="cap-90" class="cap clip" data-start="279.33" data-duration="2.1"><span>날 길이는 약 11cm</span></div><div id="cap-91" class="cap clip" data-start="281.63" data-duration="2.55"><span>그의 집 작업장에 있던 칼이었습니다</span></div><div id="cap-92" class="cap clip" data-start="284.38" data-duration="2.16"><span>칼자루는 나무로 되어 있었죠</span></div><div id="cap-93" class="cap clip" data-start="287.24" data-duration="2.81"><span>첫 자백 조서에는 이렇게 적혀 있었습니다</span></div><div id="cap-94" class="cap clip" data-start="290.25" data-duration="2.1"><span>장갑은 강에 던져 버렸고</span></div><div id="cap-95" class="cap clip" data-start="292.55" data-duration="2.94"><span>칼은 씻은 뒤, 이 빠진 세 곳을 숫돌로 갈았다</span></div><div id="cap-96" class="cap clip" data-start="295.69" data-duration="2.55"><span>1월 31일 조서에는 이런 말도 있죠</span></div><div id="cap-97" class="cap clip" data-start="298.44" data-duration="2.94"><span>"수세미로 칼자루와 날의 피를 씻어 냈다"</span></div><div id="cap-98" class="cap clip" data-start="302.08" data-duration="2.94"><span>그가 말한 장갑은 네 장을 겹쳐 뭉친 것이었죠</span></div><div id="cap-99" class="cap clip" data-start="305.22" data-duration="2.42"><span>경찰은 그 강을 네 차례 뒤졌습니다</span></div><div id="cap-100" class="cap clip" data-start="307.84" data-duration="2.94"><span>첫 수색에선 한 짝짜리 장갑 7개가 나왔지만</span></div><div id="cap-101" class="cap clip" data-start="310.98" data-duration="2.1"><span>그런 모양은 아니었죠</span></div><div id="cap-102" class="cap clip" data-start="313.28" data-duration="3.2"><span>그가 말한 모양의 장갑은 끝내 나오지 않았습니다</span></div><div id="cap-103" class="cap clip" data-start="317.18" data-duration="2.16"><span>그런데 2월 5일 자 조서에는</span></div><div id="cap-104" class="cap clip" data-start="319.54" data-duration="2.42"><span>진술이 세 가지 바뀌어 있었습니다</span></div><div id="cap-105" class="cap clip" data-start="322.16" data-duration="3.07"><span>첫째, 장갑은 강이 아니라 아궁이에서 태웠다</span></div><div id="cap-106" class="cap clip" data-start="325.43" data-duration="2.55"><span>조서에는 경찰의 물음도 적혀 있었죠</span></div><div id="cap-107" class="cap clip" data-start="328.18" data-duration="2.81"><span>"강에서 장갑이 안 나오는 건 이상하다"</span></div><div id="cap-108" class="cap clip" data-start="331.19" data-duration="3.07"><span>둘째, 칼자루에 낡은 플란넬 셔츠 천을 감았다</span></div><div id="cap-109" class="cap clip" data-start="334.46" data-duration="2.94"><span>셋째, 가죽 구두를 고무 구두로 갈아 신었다</span></div><div id="cap-110" class="cap clip" data-start="338.1" data-duration="3.07"><span>조서에 적힌 천은 길이 30cm, 폭 3cm쯤</span></div><div id="cap-111" class="cap clip" data-start="341.37" data-duration="3.07"><span>손으로 찢어 자루와 날 사이에 대여섯 번 감았다</span></div><div id="cap-112" class="cap clip" data-start="344.64" data-duration="3.2"><span>"피가 자루에 묻지 않게" 하려고 그랬다는 거죠</span></div><div id="cap-113" class="cap clip" data-start="348.04" data-duration="3.07"><span>그리고 그 천은 장갑과 함께 아궁이에서 태웠다</span></div><div id="cap-114" class="cap clip" data-start="351.31" data-duration="3.07"><span>조서대로라면 그 천은 이미 재가 됐어야 합니다</span></div><div id="cap-115" class="cap clip" data-start="354.58" data-duration="2.94"><span>2월 9일, 칼의 혈액 감정 결과가 나옵니다</span></div><div id="cap-116" class="cap clip" data-start="357.72" data-duration="2.16"><span>칼에서 피는 확인되지 않았죠</span></div><div id="cap-117" class="cap clip" data-start="360.58" data-duration="2.55"><span>조서에는 구두 이야기도 있었습니다</span></div><div id="cap-118" class="cap clip" data-start="363.33" data-duration="3.07"><span>가죽 구두는 1월 18일 검사를 받은 뒤 태웠고</span></div><div id="cap-119" class="cap clip" data-start="366.6" data-duration="2.68"><span>남은 금속 부품은 석유통에 버렸다고요</span></div><div id="cap-120" class="cap clip" data-start="369.48" data-duration="2.16"><span>이 조서에는 이런 문장도 있죠</span></div><div id="cap-121" class="cap clip" data-start="371.84" data-duration="2.81"><span>"단념하고 사실대로 말할 마음이 됐다"</span></div><div id="cap-122" class="cap clip" data-start="374.85" data-duration="3.07"><span>같은 날 그는 집 창고의 권총과 실탄도 털어놓죠</span></div><div id="cap-123" class="cap clip" data-start="378.12" data-duration="2.94"><span>경찰이 뒤지자 정말 그 자리에서 나왔습니다</span></div><div id="cap-124" class="cap clip" data-start="381.76" data-duration="3.2"><span>1985년 2월 10일, 살인으로 기소됩니다</span></div><div id="cap-125" class="cap clip" data-start="385.16" data-duration="2.81"><span>재판은 구마모토지방재판소에서 열렸죠</span></div><div id="cap-126" class="cap clip" data-start="388.17" data-duration="3.2"><span>4월 8일 첫 공판에선 공소사실을 인정했습니다</span></div><div id="cap-127" class="cap clip" data-start="391.57" data-duration="2.68"><span>그런데 8월 13일 다섯 번째 공판에서</span></div><div id="cap-128" class="cap clip" data-start="394.45" data-duration="2.42"><span>그는 범행을 분명하게 부인합니다</span></div><div id="cap-129" class="cap clip" data-start="397.07" data-duration="2.55"><span>수사 단계의 자백은 거짓이었다고요</span></div><div id="cap-130" class="cap clip" data-start="400.32" data-duration="2.68"><span>판결이 자백을 믿은 이유는 이랬습니다</span></div><div id="cap-131" class="cap clip" data-start="403.2" data-duration="2.94"><span>첫째, 태웠다는 구두의 금속 부품이 나왔다</span></div><div id="cap-132" class="cap clip" data-start="406.34" data-duration="2.81"><span>부엌 창 밖 등유통 속 꽁치 깡통 안에서였죠</span></div><div id="cap-133" class="cap clip" data-start="409.35" data-duration="3.07"><span>둘째, 어느 집 거실에 불이 켜져 있었다는 진술</span></div><div id="cap-134" class="cap clip" data-start="412.62" data-duration="3.2"><span>판결은 이런 것을 '비밀의 폭로'라 불렀습니다</span></div><div id="cap-135" class="cap clip" data-start="416.02" data-duration="3.2"><span>수사관도 몰랐던 사실을 그가 먼저 말했다는 거죠</span></div><div id="cap-136" class="cap clip" data-start="419.42" data-duration="2.29"><span>셋째, 폴리그래프의 특이 반응</span></div><div id="cap-137" class="cap clip" data-start="422.41" data-duration="2.1"><span>판결은 칼에 피가 없는 것도</span></div><div id="cap-138" class="cap clip" data-start="424.71" data-duration="2.81"><span>천을 감고 씻었으니 이상하지 않다고 했죠</span></div><div id="cap-139" class="cap clip" data-start="427.72" data-duration="3.59"><span>1986년 12월 22일, 징역 13년이 선고됩니다</span></div><div id="cap-140" class="cap clip" data-start="431.51" data-duration="2.81"><span>살인과 권총 사건을 함께 판단한 형이었죠</span></div><div id="cap-141" class="cap clip" data-start="434.52" data-duration="3.46"><span>1988년엔 항소, 1990년엔 상고가 기각되고</span></div><div id="cap-142" class="cap clip" data-start="438.18" data-duration="2.55"><span>그리고 2월 14일, 형이 확정되죠</span></div><div id="cap-143" class="cap clip" data-start="441.43" data-duration="2.68"><span>판결 뒤 그는 12년 남짓 갇혀 지냅니다</span></div><div id="cap-144" class="cap clip" data-start="444.31" data-duration="2.42"><span>그중 약 9년이 형을 산 기간이었죠</span></div><div id="cap-145" class="cap clip" data-start="446.93" data-duration="2.42"><span>1999년 3월 25일, 가석방</span></div><div id="cap-146" class="cap clip" data-start="449.55" data-duration="2.42"><span>그해 7월 22일 형기가 끝납니다</span></div><div id="cap-147" class="cap clip" data-start="452.17" data-duration="2.94"><span>그렇다면 이 판결을 흔든 것은 무엇이었을까</span></div><div id="cap-148" class="cap clip" data-start="455.81" data-duration="2.94"><span>시간이 흘러, 재심을 준비하던 변호인단이</span></div><div id="cap-149" class="cap clip" data-start="458.95" data-duration="2.55"><span>검찰이 보관하던 증거를 열람합니다</span></div><div id="cap-150" class="cap clip" data-start="461.7" data-duration="3.2"><span>그 속에서 자백에 나온 셔츠 천 다섯 조각이 나오죠</span></div><div id="cap-151" class="cap clip" data-start="465.1" data-duration="3.07"><span>원래 재판에는 증거로 나온 적이 없는 천이었죠</span></div><div id="cap-152" class="cap clip" data-start="468.37" data-duration="3.59"><span>2012년, 후견인이 그를 대신해 재심을 청구합니다</span></div><div id="cap-153" class="cap clip" data-start="472.16" data-duration="2.55"><span>형이 확정된 지 22년 만이었습니다</span></div><div id="cap-154" class="cap clip" data-start="474.91" data-duration="3.59"><span>이후의 판단은 주로 2017년 후쿠오카고법의 것이죠</span></div><div id="cap-155" class="cap clip" data-start="479.2" data-duration="2.68"><span>다섯 조각을 맞추면 셔츠 한 벌이 됩니다</span></div><div id="cap-156" class="cap clip" data-start="482.08" data-duration="3.2"><span>결정문은 '거의 완전한 형태'의 셔츠라 적었죠</span></div><div id="cap-157" class="cap clip" data-start="485.48" data-duration="2.68"><span>빨강, 갈색, 흰색 체크무늬 셔츠였죠</span></div><div id="cap-158" class="cap clip" data-start="488.36" data-duration="2.68"><span>그리고 그중 하나는 왼쪽 소매였습니다</span></div><div id="cap-159" class="cap clip" data-start="491.24" data-duration="2.29"><span>살구색 바탕에 갈색과 빨강 체크</span></div><div id="cap-160" class="cap clip" data-start="493.73" data-duration="3.07"><span>조서에서 '태웠다'고 했던 바로 그 소매였죠</span></div><div id="cap-161" class="cap clip" data-start="497.5" data-duration="3.07"><span>압수된 날짜를 따라가 보면 이상한 점이 보이죠</span></div><div id="cap-162" class="cap clip" data-start="500.77" data-duration="3.07"><span>1월 21일, 가족이 셔츠 천 3조각을 냅니다</span></div><div id="cap-163" class="cap clip" data-start="504.04" data-duration="3.07"><span>2월 5일 수색에서 약 27×34cm 1조각</span></div><div id="cap-164" class="cap clip" data-start="507.31" data-duration="3.2"><span>2월 6일, 맞춰 보니 왼소매가 어깨부터 없었죠</span></div><div id="cap-165" class="cap clip" data-start="510.71" data-duration="2.94"><span>그는 그 왼소매를 칼에 감았다고 진술합니다</span></div><div id="cap-166" class="cap clip" data-start="513.85" data-duration="3.07"><span>'왼소매를 태웠다'는 조서도 이날 작성됐죠</span></div><div id="cap-167" class="cap clip" data-start="517.62" data-duration="2.16"><span>2월 10일, 살인으로 기소</span></div><div id="cap-168" class="cap clip" data-start="519.98" data-duration="2.16"><span>그리고 나흘 뒤인 2월 14일</span></div><div id="cap-169" class="cap clip" data-start="522.34" data-duration="3.2"><span>경찰은 그의 착각일 수 있다며 다시 집을 뒤집니다</span></div><div id="cap-170" class="cap clip" data-start="525.74" data-duration="3.2"><span>창고와 집 사이 모퉁이에서 마지막 조각이 나오죠</span></div><div id="cap-171" class="cap clip" data-start="529.14" data-duration="2.68"><span>그 마지막 조각이 바로 왼소매였습니다</span></div><div id="cap-172" class="cap clip" data-start="532.02" data-duration="2.94"><span>'태웠다'는 조서도, 기소도 끝난 뒤였죠</span></div><div id="cap-173" class="cap clip" data-start="535.66" data-duration="3.07"><span>훗날 재심 판결은 개시 결정을 이렇게 옮깁니다</span></div><div id="cap-174" class="cap clip" data-start="538.93" data-duration="3.33"><span>"왼소매가 남아 있고, 혈액도 확인되지 않았다"</span></div><div id="cap-175" class="cap clip" data-start="542.46" data-duration="2.16"><span>조서와 맞지 않는 두 사실이죠</span></div><div id="cap-176" class="cap clip" data-start="544.82" data-duration="2.94"><span>4월 5일, 소매를 포함한 5조각이 검찰로</span></div><div id="cap-177" class="cap clip" data-start="547.96" data-duration="3.07"><span>검찰에 넘어간 증거 속에 그 소매도 있었던 거죠</span></div><div id="cap-178" class="cap clip" data-start="551.23" data-duration="2.1"><span>첫 공판 사흘 전의 일입니다</span></div><div id="cap-179" class="cap clip" data-start="554.03" data-duration="3.33"><span>검찰은 작업장에 비슷한 천이 많았다고 반박합니다</span></div><div id="cap-180" class="cap clip" data-start="557.56" data-duration="2.68"><span>하지만 1월 21일 수색 보고서를 보면</span></div><div id="cap-181" class="cap clip" data-start="560.44" data-duration="3.2"><span>셔츠 3조각 말고 나온 천은 4조각뿐이었습니다</span></div><div id="cap-182" class="cap clip" data-start="563.84" data-duration="2.29"><span>흰 천, 초록 꽃무늬 천, 빨간 천</span></div><div id="cap-183" class="cap clip" data-start="566.33" data-duration="2.94"><span>그리고 검푸르게 더러워진 천 하나씩이었죠</span></div><div id="cap-184" class="cap clip" data-start="569.47" data-duration="3.33"><span>그도 다른 셔츠를 찢은 천은 없었다고 진술했습니다</span></div><div id="cap-185" class="cap clip" data-start="573.0" data-duration="3.2"><span>헷갈릴 만큼 많지는 않았다는 게 고법의 판단이죠</span></div><div id="cap-186" class="cap clip" data-start="576.9" data-duration="3.07"><span>2월 5일 전 조서엔 '칼을 씻었다'뿐이었죠</span></div><div id="cap-187" class="cap clip" data-start="580.17" data-duration="2.94"><span>천 이야기는 2월 5일 조서에 처음 나옵니다</span></div><div id="cap-188" class="cap clip" data-start="583.31" data-duration="2.29"><span>재판에서 그는 이렇게 증언했죠</span></div><div id="cap-189" class="cap clip" data-start="585.8" data-duration="3.2"><span>"검사가 자루에 피가 묻을 텐데, 하고 물어서"</span></div><div id="cap-190" class="cap clip" data-start="589.2" data-duration="2.81"><span>"생각나는 대로 넝마를 감았다고 했다"</span></div><div id="cap-191" class="cap clip" data-start="592.21" data-duration="2.94"><span>훗날 배상 소송 1심은 그 말이 처음 나온 곳을</span></div><div id="cap-192" class="cap clip" data-start="595.35" data-duration="2.29"><span>2월 5일 경찰 조사로 봤습니다</span></div><div id="cap-193" class="cap clip" data-start="598.34" data-duration="2.29"><span>그는 칼자루 이야기도 했습니다</span></div><div id="cap-194" class="cap clip" data-start="600.83" data-duration="2.42"><span>자루는 후박나무라 구멍이 많아서</span></div><div id="cap-195" class="cap clip" data-start="603.45" data-duration="2.42"><span>물이나 피를 잘 빨아들인다는 거죠</span></div><div id="cap-196" class="cap clip" data-start="606.07" data-duration="2.94"><span>그 자루에서도 혈액은 확인되지 않았습니다</span></div><div id="cap-197" class="cap clip" data-start="609.21" data-duration="3.07"><span>수사관에게 맞춘, 사실과 다른 진술일 가능성</span></div><div id="cap-198" class="cap clip" data-start="612.48" data-duration="3.33"><span>천 이야기를 두고 고법이 부정하지 못한 가능성이죠</span></div><div id="cap-199" class="cap clip" data-start="616.01" data-duration="2.42"><span>그렇다면 이 칼은 정말 흉기였을까</span></div><div id="cap-200" class="cap clip" data-start="619.13" data-duration="2.94"><span>재심 청구 때 새로 제출된 기록이 있었습니다</span></div><div id="cap-201" class="cap clip" data-start="622.27" data-duration="2.68"><span>당시 피해자를 부검한 교수의 메모였죠</span></div><div id="cap-202" class="cap clip" data-start="625.15" data-duration="2.1"><span>교수는 상처 깊이를 적을 때</span></div><div id="cap-203" class="cap clip" data-start="627.45" data-duration="3.07"><span>더 정확히 잰 것엔 '약', 아닌 것엔 '대략'</span></div><div id="cap-204" class="cap clip" data-start="630.72" data-duration="2.94"><span>상처 15곳 가운데 '약'으로 잰 것은 6곳</span></div><div id="cap-205" class="cap clip" data-start="633.86" data-duration="3.2"><span>고법은 그중 2곳이 칼 모양과 맞지 않는다고 봤죠</span></div><div id="cap-206" class="cap clip" data-start="637.76" data-duration="2.29"><span>한 상처의 입구는 약 1.5cm</span></div><div id="cap-207" class="cap clip" data-start="640.25" data-duration="2.1"><span>깊이는 약 4.7cm였죠</span></div><div id="cap-208" class="cap clip" data-start="642.55" data-duration="3.33"><span>상처대로면 그 지점 폭은 1.5cm 이하여야 하죠</span></div><div id="cap-209" class="cap clip" data-start="646.08" data-duration="3.2"><span>그런데 칼끝 4.7cm 지점의 폭은 2.1cm</span></div><div id="cap-210" class="cap clip" data-start="649.48" data-duration="3.33"><span>폭 1.5cm는 끝에서 약 3.2cm 지점이었죠</span></div><div id="cap-211" class="cap clip" data-start="653.01" data-duration="2.94"><span>입구가 칼 폭보다 0.6cm나 좁았습니다</span></div><div id="cap-212" class="cap clip" data-start="656.15" data-duration="3.2"><span>"미묘한 차이라 할 수 없다", 고법의 말입니다</span></div><div id="cap-213" class="cap clip" data-start="660.05" data-duration="2.68"><span>다른 상처 하나도 깊이는 약 4.8cm</span></div><div id="cap-214" class="cap clip" data-start="662.93" data-duration="2.29"><span>입구는 역시 약 1.5cm였죠</span></div><div id="cap-215" class="cap clip" data-start="665.42" data-duration="2.42"><span>'대략'으로 잰 9곳 가운데서도</span></div><div id="cap-216" class="cap clip" data-start="668.04" data-duration="3.07"><span>4곳이 어긋날 수 있다는 게 고법의 판단이었죠</span></div><div id="cap-217" class="cap clip" data-start="671.31" data-duration="3.2"><span>검찰은 피부가 눌리면 입구가 좁아진다고 맞섰죠</span></div><div id="cap-218" class="cap clip" data-start="674.71" data-duration="2.68"><span>하지만 새 감정은 그 부위가 지방이 적어</span></div><div id="cap-219" class="cap clip" data-start="677.59" data-duration="2.55"><span>피부가 잘 눌리지 않는다고 봤습니다</span></div><div id="cap-220" class="cap clip" data-start="680.84" data-duration="2.29"><span>그리고 옷에 남은 구멍이 있었죠</span></div><div id="cap-221" class="cap clip" data-start="683.33" data-duration="2.55"><span>스웨터 구멍은 15~16.6mm</span></div><div id="cap-222" class="cap clip" data-start="686.08" data-duration="2.1"><span>속옷 구멍은 15mm</span></div><div id="cap-223" class="cap clip" data-start="688.38" data-duration="2.94"><span>상처 입구 약 1.5cm와 거의 같았습니다</span></div><div id="cap-224" class="cap clip" data-start="691.52" data-duration="2.55"><span>고법은 잘 드는 칼날에 찔렸다고 봤고</span></div><div id="cap-225" class="cap clip" data-start="694.27" data-duration="3.2"><span>구멍이 같으니 큰 '눌림 현상'은 없었다는 거죠</span></div><div id="cap-226" class="cap clip" data-start="697.67" data-duration="3.46"><span>칼 모양과는 "상당히 모순된다"는 결론이었습니다</span></div><div id="cap-227" class="cap clip" data-start="701.83" data-duration="2.81"><span>검찰이 내놓은 물건이 하나 더 있었습니다</span></div><div id="cap-228" class="cap clip" data-start="704.84" data-duration="2.55"><span>1월 9일 압수된 그의 회색 골프웨어</span></div><div id="cap-229" class="cap clip" data-start="707.59" data-duration="3.2"><span>혈흔 예비 검사에서 양성인 부분이 있었다는 거죠</span></div><div id="cap-230" class="cap clip" data-start="710.99" data-duration="2.55"><span>양은 손가락 끝만 한, 아주 적은 정도</span></div><div id="cap-231" class="cap clip" data-start="713.74" data-duration="2.29"><span>혈액형 검사도 하지 않았습니다</span></div><div id="cap-232" class="cap clip" data-start="716.23" data-duration="3.46"><span>고법 판단으로는, 사건과의 관련이 인정되지 않았죠</span></div><div id="cap-233" class="cap clip" data-start="720.39" data-duration="3.2"><span>그는 재판에서 폴리그래프 반응도 설명했습니다</span></div><div id="cap-234" class="cap clip" data-start="723.79" data-duration="3.2"><span>1월 8일, 장기 친구에게 현장 이야기를 들었고</span></div><div id="cap-235" class="cap clip" data-start="727.19" data-duration="2.1"><span>사진도 봤다고 했죠</span></div><div id="cap-236" class="cap clip" data-start="729.49" data-duration="3.07"><span>자전거 이야기는 경찰의 귓속말로 알았다고요</span></div><div id="cap-237" class="cap clip" data-start="732.76" data-duration="2.68"><span>1월 10일 무렵부터 보고 들은 것으로</span></div><div id="cap-238" class="cap clip" data-start="735.64" data-duration="2.29"><span>줄거리를 짜 맞추게 됐다는 거죠</span></div><div id="cap-239" class="cap clip" data-start="738.63" data-duration="2.1"><span>고법의 판단은 이랬습니다</span></div><div id="cap-240" class="cap clip" data-start="740.93" data-duration="2.68"><span>범인이 아니어도 반응은 나올 수 있었고</span></div><div id="cap-241" class="cap clip" data-start="743.81" data-duration="2.68"><span>추궁 끝에 자백했을 가능성도 충분하다</span></div><div id="cap-242" class="cap clip" data-start="746.69" data-duration="2.1"><span>그리고 이렇게 정리합니다</span></div><div id="cap-243" class="cap clip" data-start="748.99" data-duration="2.81"><span>"자백 전체의 신용성이 크게 흔들린다"</span></div><div id="cap-244" class="cap clip" data-start="752.0" data-duration="2.55"><span>유일한 증거였던 자백이 흔들린 거죠</span></div><div id="cap-245" class="cap clip" data-start="755.25" data-duration="2.94"><span>2015년엔 그의 아들도 청구에 나섭니다</span></div><div id="cap-246" class="cap clip" data-start="758.39" data-duration="2.81"><span>2016년 6월 30일, 재심 개시 결정</span></div><div id="cap-247" class="cap clip" data-start="761.4" data-duration="3.07"><span>결정은 자백 말고는 결정적 증거가 없다고 봤죠</span></div><div id="cap-248" class="cap clip" data-start="764.67" data-duration="3.2"><span>아들은 2017년 9월 무렵 세상을 떠났습니다</span></div><div id="cap-249" class="cap clip" data-start="768.07" data-duration="3.2"><span>그해 11월, 고법은 검찰의 항고를 기각합니다</span></div><div id="cap-250" class="cap clip" data-start="771.47" data-duration="3.07"><span>2018년 10월, 재심 개시가 확정됩니다</span></div><div id="cap-251" class="cap clip" data-start="774.74" data-duration="3.2"><span>그렇다면 검찰은 재심 법정에 무엇을 들고 왔을까</span></div><div id="cap-252" class="cap clip" data-start="778.64" data-duration="3.2"><span>2019년 2월 8일, 재심 첫 공판이 열립니다</span></div><div id="cap-253" class="cap clip" data-start="782.04" data-duration="2.81"><span>검찰은 자백 등 많은 증거를 다시 신청했죠</span></div><div id="cap-254" class="cap clip" data-start="785.05" data-duration="2.1"><span>다만 살인에 대해서는</span></div><div id="cap-255" class="cap clip" data-start="787.35" data-duration="3.2"><span>새 유죄 주장·입증은 하지 않겠다고 밝혔습니다</span></div><div id="cap-256" class="cap clip" data-start="790.75" data-duration="3.07"><span>법원은 자백 등의 증거 신청을 받지 않았습니다</span></div><div id="cap-257" class="cap clip" data-start="794.52" data-duration="2.55"><span>판결문의 괄호 안엔 이런 문장도 있죠</span></div><div id="cap-258" class="cap clip" data-start="797.27" data-duration="2.94"><span>검찰이 신청하지 않은 증거가 있었다는 거죠</span></div><div id="cap-259" class="cap clip" data-start="800.41" data-duration="3.07"><span>"태웠다고 된 천 조각 등은 청구하지 않았다"</span></div><div id="cap-260" class="cap clip" data-start="803.68" data-duration="2.81"><span>조서에서 '태웠다'던 바로 그 천이었죠</span></div><div id="cap-261" class="cap clip" data-start="806.69" data-duration="2.55"><span>판결문은 그 천을 이렇게 불렀습니다</span></div><div id="cap-262" class="cap clip" data-start="809.44" data-duration="2.42"><span>"가장 중요한 증거 가운데 하나"</span></div><div id="cap-263" class="cap clip" data-start="812.56" data-duration="2.16"><span>첫 공판에서 두 달이 채 안 된 날</span></div><div id="cap-264" class="cap clip" data-start="814.92" data-duration="3.2"><span>2019년 3월 28일, 재심 판결이 나옵니다</span></div><div id="cap-265" class="cap clip" data-start="818.32" data-duration="3.33"><span>"피고인이 피해자를 살해했다고 인정할 수 없다"</span></div><div id="cap-266" class="cap clip" data-start="821.85" data-duration="2.29"><span>범죄의 증명이 없다는 이유였죠</span></div><div id="cap-267" class="cap clip" data-start="824.34" data-duration="2.29"><span>살인에 대해서는 무죄였습니다</span></div><div id="cap-268" class="cap clip" data-start="826.83" data-duration="2.68"><span>사건으로부터 34년 2개월 만이었죠</span></div><div id="cap-269" class="cap clip" data-start="830.21" data-duration="2.94"><span>하지만 판결의 주문에는 한 줄이 더 있습니다</span></div><div id="cap-270" class="cap clip" data-start="833.35" data-duration="2.68"><span>별건, 집에 권총과 실탄을 갖고 있던 죄</span></div><div id="cap-271" class="cap clip" data-start="836.23" data-duration="2.29"><span>검찰의 구형은 징역 2년이었죠</span></div><div id="cap-272" class="cap clip" data-start="838.72" data-duration="2.81"><span>판결은 이 죄에 징역 1년을 선고했습니다</span></div><div id="cap-273" class="cap clip" data-start="841.73" data-duration="2.68"><span>그 1년은 이미 구금된 날수로 채워졌죠</span></div><div id="cap-274" class="cap clip" data-start="844.61" data-duration="3.33"><span>양쪽이 상소권을 포기해, 판결은 그날 확정됩니다</span></div><div id="cap-275" class="cap clip" data-start="848.14" data-duration="3.07"><span>그때 그는 85세, 치매로 요양 시설에 있었죠</span></div><div id="cap-276" class="cap clip" data-start="851.91" data-duration="3.2"><span>그렇다면 법원은 그 34년을 어떻게 판단했을까</span></div><div id="cap-277" class="cap clip" data-start="855.31" data-duration="3.33"><span>2020년, 그는 국가와 현에 배상 소송을 냅니다</span></div><div id="cap-278" class="cap clip" data-start="858.84" data-duration="3.2"><span>판결문에 적힌 청구액은 모두 약 8,481만 엔</span></div><div id="cap-279" class="cap clip" data-start="862.24" data-duration="2.81"><span>그리고 소송을 낸 다음 달, 세상을 떠났죠</span></div><div id="cap-280" class="cap clip" data-start="865.25" data-duration="2.55"><span>소송은 상속인들이 이어받았습니다</span></div><div id="cap-281" class="cap clip" data-start="868.5" data-duration="3.07"><span>2025년 1심은 국가 책임만 인정했습니다</span></div><div id="cap-282" class="cap clip" data-start="871.77" data-duration="3.33"><span>검사가 왼소매가 남은 사실을 밝혔어야 했다는 거죠</span></div><div id="cap-283" class="cap clip" data-start="875.3" data-duration="3.07"><span>경찰의 체포 전 조사는 위법까진 아니라고 봤고</span></div><div id="cap-284" class="cap clip" data-start="878.57" data-duration="2.81"><span>배상액은 약 2,381만 엔이었습니다</span></div><div id="cap-285" class="cap clip" data-start="881.58" data-duration="3.2"><span>2026년 2심은 체포 전 조사도 위법이라 했죠</span></div><div id="cap-286" class="cap clip" data-start="884.98" data-duration="3.33"><span>"오로지 자백시키려는 조사"였다는 판단입니다</span></div><div id="cap-287" class="cap clip" data-start="888.51" data-duration="3.2"><span>배상액은 같았지만, 이번엔 현도 함께 물게 됐죠</span></div><div id="cap-288" class="cap clip" data-start="892.41" data-duration="2.68"><span>2심 판결문은 검사의 일도 짚었습니다</span></div><div id="cap-289" class="cap clip" data-start="895.29" data-duration="3.2"><span>공소를 취소하거나 무죄 논고를 했어야 한다고요</span></div><div id="cap-290" class="cap clip" data-start="898.69" data-duration="2.55"><span>그리고 천을 다룬 방식을 이렇게 썼죠</span></div><div id="cap-291" class="cap clip" data-start="901.44" data-duration="2.1"><span>"이른바 묵살한 형태"</span></div><div id="cap-292" class="cap clip" data-start="903.74" data-duration="2.1"><span>현은 상고하지 않았고</span></div><div id="cap-293" class="cap clip" data-start="906.04" data-duration="3.07"><span>국가는 8월 7일 최고재판소에 상고했습니다</span></div><div id="cap-294" class="cap clip" data-start="909.31" data-duration="3.33"><span>2026년 11월 기준, 결과는 알려지지 않았죠</span></div><div id="cap-295" class="cap clip" data-start="913.34" data-duration="2.94"><span>1985년 1월, 고타츠 위엔 귤이 있었죠</span></div><div id="cap-296" class="cap clip" data-start="916.48" data-duration="2.55"><span>그 귤은 폴리그래프의 질문이 되었고</span></div><div id="cap-297" class="cap clip" data-start="919.23" data-duration="2.81"><span>그의 말로는 조사실에서도 귤이 나왔고요</span></div><div id="cap-298" class="cap clip" data-start="922.24" data-duration="2.68"><span>2심에 따르면, 폴리그래프 감정서는</span></div><div id="cap-299" class="cap clip" data-start="925.12" data-duration="2.68"><span>확정 판결의 증거 목록엔 오르지 않았죠</span></div><div id="cap-300" class="cap clip" data-start="928.0" data-duration="3.07"><span>고법은 그 반응이 범인의 증거는 아니라고 봤죠</span></div><div id="cap-301" class="cap clip" data-start="931.77" data-duration="2.55"><span>34년 만에 확정된 것은 이것입니다</span></div><div id="cap-302" class="cap clip" data-start="934.52" data-duration="2.55"><span>그를 범인으로 인정할 수 없다는 무죄</span></div><div id="cap-303" class="cap clip" data-start="937.27" data-duration="3.59"><span>판결은 피해자가 '누군가에게' 살해됐다고만 적었죠</span></div><div id="cap-304" class="cap clip" data-start="941.06" data-duration="2.68"><span>어느 판결에도 범인의 이름은 없습니다</span></div><div id="cap-305" class="cap clip" data-start="943.94" data-duration="3.07"><span>그 방에서 무슨 일이 있었는지는 아직 빈칸이죠</span></div><div id="cap-306" class="cap clip" data-start="947.21" data-duration="2.94"><span>그를 가리킨 증거는 처음부터 자백뿐이었죠</span></div><div id="cap-307" class="cap clip" data-start="950.85" data-duration="2.68"><span>다시 그 셔츠 앞으로 돌아가 보겠습니다</span></div><div id="cap-308" class="cap clip" data-start="953.73" data-duration="3.33"><span>1985년 2월 14일, 모퉁이에서 나온 왼소매</span></div><div id="cap-309" class="cap clip" data-start="957.26" data-duration="3.2"><span>조서대로라면 아궁이에서 타 버렸어야 할 천이죠</span></div><div id="cap-310" class="cap clip" data-start="960.66" data-duration="2.1"><span>혈액도 확인되지 않은 채</span></div><div id="cap-311" class="cap clip" data-start="962.96" data-duration="2.68"><span>재심의 문을 연 근거 가운데 하나가 됐죠</span></div><div id="cap-312" class="cap clip" data-start="965.84" data-duration="2.81"><span>조서에는 '태웠다'고 적혀 있었습니다</span></div><div id="cap-313" class="cap clip" data-start="968.85" data-duration="2.55"><span>그 셔츠 왼소매는, 남아 있었습니다</span></div>
