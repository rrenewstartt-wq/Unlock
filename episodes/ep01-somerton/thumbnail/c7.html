  const spots = [[SG + 0.040, 0.062], [SG + 0.071, 0.046], [SG + 0.022, 0.028], [SG + 0.052, 0.022]];
  for (const [ss, ww] of spots) {
    const r = 0.00025 + rnd() * 0.0002;
    const g = new THREE.IcosahedronGeometry(r, 1);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) * (0.8 + 0.4 * hsh(i, 3)), p.getY(i) * (0.7 + 0.3 * hsh(i, 5)), p.getZ(i) * (0.8 + 0.4 * hsh(i, 7)));
    g.computeVertexNormals();
    const s = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: cols[Math.floor(rnd() * cols.length)], roughness: 0.55 }));
    s.position.copy(surf(ss, ww).p).addScaledVector(surf(ss, ww).f.N, r * 0.4); s.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
    s.castShadow = s.receiveShadow = true; S.add(s);
  }
}

// ---------- light: one low dawn light raking across the wool from the head/shoulder side ----------
const M = new THREE.Vector3(...window.__cig.mid);
const DBG = new URLSearchParams(location.search).get('dbg');   // scratch views only; the shoot uses none
if (DBG === 'wide') { P.cam = [0.10, 0.30, 0.30]; P.fov = 40; P.dof.K = 0; }
if (DBG === 'side') { P.cam = [-0.35, 0.10, 0.0]; P.fov = 40; P.dof.K = 0; }
{ const q = new URLSearchParams(location.search); const v = (k) => q.get(k) && q.get(k).split(',').map(Number);
  if (v('cam')) P.cam = v('cam'); if (v('look')) P.look = v('look'); if (v('fov')) P.fov = v('fov')[0]; if (v('K')) P.dof.K = v('K')[0]; if (v('key')) P.key.pos = v('key'); }
t.camera(M.clone().add(new THREE.Vector3(...P.cam)).toArray(), M.clone().add(new THREE.Vector3(...P.look)).toArray(), P.fov);
t.cam.rotateZ(P.roll || 0);   // slight tilt: the shoulder line slopes like a body, not a table edge
t.cam.near = 0.02; t.cam.far = 3; t.cam.updateProjectionMatrix();
const key = t.key({ pos: M.clone().add(new THREE.Vector3(...P.key.pos)).toArray(), target: M.toArray(), intensity: P.key.intensity, angle: 0.32, penumbra: 0.9, color: '#ffeedd', decay: 0 });
key.shadow.camera.near = 0.05; key.shadow.camera.far = 1.0; key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.00004; key.shadow.normalBias = 0.0002; key.shadow.radius = 9; key.shadow.blurSamples = 16;
t.amb(P.amb);

// ---------- depth of field (thumbkit has none): render to HDR target with depth, then a gather blur ----------
const w = t.w, h = t.h;
const depthTex = new THREE.DepthTexture(w, h); depthTex.type = THREE.UnsignedIntType;
const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4, depthTexture: depthTex });
const rt2 = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
const focusZ = t.cam.position.distanceTo(new THREE.Vector3(...window.__cig.mid));
const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const cocMat = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: rt.texture }, tDepth: { value: depthTex }, near: { value: t.cam.near }, far: { value: t.cam.far },
    focusZ: { value: focusZ }, K: { value: P.dof.K }, maxR: { value: P.dof.maxR } },
  vertexShader: vs, toneMapped: false, depthTest: false, depthWrite: false,
  fragmentShader: `#include <packing>
    uniform sampler2D tColor; uniform sampler2D tDepth; uniform float near, far, focusZ, K, maxR; varying vec2 vUv;
    void main(){
      float d = texture2D(tDepth, vUv).x;
      float z = -perspectiveDepthToViewZ(d, near, far);
      float coc = clamp(K * (z - focusZ) / z, -maxR, maxR);
      gl_FragColor = vec4(texture2D(tColor, vUv).rgb, coc);
    }`,
});
const dofMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: rt2.texture }, px: { value: new THREE.Vector2(1 / w, 1 / h) }, res: { value: new THREE.Vector2(w, h) } },
  vertexShader: vs, depthTest: false, depthWrite: false,
  fragmentShader: `uniform sampler2D tSrc; uniform vec2 px; uniform vec2 res; varying vec2 vUv;
    const int N = 160; const float GA = 2.39996323;
    float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
    void main(){
      vec4 c0 = texture2D(tSrc, vUv);
      float r0 = abs(c0.a);
      vec3 acc = c0.rgb; float ws = 1.0;
      if (r0 > 0.7) {
        float rot = ign(vUv * res) * 6.2831853;
        for (int i = 1; i < N; i++) {
          float fi = float(i);
          float rad = r0 * sqrt(fi / float(N));
          float th = fi * GA + rot;
          vec4 s = texture2D(tSrc, vUv + vec2(cos(th), sin(th)) * rad * px);
          float rs = abs(s.a);
          if (s.a > c0.a) rs = min(rs, r0);      // farther stuff never bleeds over nearer
          float wgt = smoothstep(rad - 1.5, rad + 0.5, rs);
          acc += s.rgb * wgt; ws += wgt;
        }
      }
      // faint lateral chromatic aberration toward the corners (real lens)
      vec2 q = vUv - 0.5;
      gl_FragColor = vec4(acc / ws, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), cocMat);
quad.frustumCulled = false;
const qScene = new THREE.Scene(); qScene.add(quad);
const qCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
t.render = () => {
  R.setRenderTarget(rt); R.render(S, t.cam);
  quad.material = cocMat; R.setRenderTarget(rt2); R.render(qScene, qCam);
  quad.material = dofMat; R.setRenderTarget(null); R.render(qScene, qCam);
};
await t.done();
