    <div id="cap-0" class="cap clip" data-start="0.4" data-duration="2.94"><span>1948년 경찰이 X로 표시한 바로 이 자리</span></div><div id="cap-1" class="cap clip" data-start="3.54" data-duration="2.94"><span>여기서 발견된 남자에겐 이름이 없었습니다</span></div><div id="cap-2" class="cap clip" data-start="6.68" data-duration="2.55"><span>아직 아무도 풀지 못한 다섯 줄의 암호</span></div><div id="cap-3" class="cap clip" data-start="9.93" data-duration="2.81"><span>1948년 12월 1일 오전 6시 30분</span></div><div id="cap-4" class="cap clip" data-start="12.94" data-duration="2.68"><span>호주 애들레이드 남서쪽, 서머턴 해변</span></div><div id="cap-5" class="cap clip" data-start="15.82" data-duration="2.81"><span>방파제에 머리를 기댄 남자가 발견됩니다</span></div><div id="cap-6" class="cap clip" data-start="18.83" data-duration="2.81"><span>다리는 쭉 뻗었고, 두 발은 엇갈려 있었죠</span></div><div id="cap-7" class="cap clip" data-start="21.84" data-duration="2.29"><span>옷깃 위엔 반쯤 피운 담배 한 개비</span></div><div id="cap-8" class="cap clip" data-start="24.83" data-duration="2.94"><span>그런데 이 남자에겐 이상한 점이 있었습니다</span></div><div id="cap-9" class="cap clip" data-start="27.97" data-duration="2.55"><span>지갑도, 신분증도, 모자도 없었고</span></div><div id="cap-10" class="cap clip" data-start="30.72" data-duration="2.68"><span>옷에 붙은 상표는 전부 잘려 나가 있었죠</span></div><div id="cap-11" class="cap clip" data-start="33.6" data-duration="3.33"><span>주머니에서 나온 건 쓰지 않은 기차표, 버스표 한 장</span></div><div id="cap-12" class="cap clip" data-start="37.13" data-duration="3.46"><span>알루미늄 빗, 껌 반 통, 담배, 성냥이 전부였습니다</span></div><div id="cap-13" class="cap clip" data-start="40.79" data-duration="2.55"><span>그렇다면 이 남자는 대체 누구였을까</span></div><div id="cap-14" class="cap clip" data-start="44.04" data-duration="2.16"><span>이 남자의 이름을 알아내는 데</span></div><div id="cap-15" class="cap clip" data-start="46.4" data-duration="2.1"><span>무려 73년이 걸렸습니다</span></div><div id="cap-16" class="cap clip" data-start="48.7" data-duration="2.55"><span>그리고 그날 밤 무슨 일이 있었는지는</span></div><div id="cap-17" class="cap clip" data-start="51.45" data-duration="2.1"><span>지금도 아무도 모릅니다</span></div><div id="cap-18" class="cap clip" data-start="54.25" data-duration="2.29"><span>하루 전으로 되돌려 보겠습니다</span></div><div id="cap-19" class="cap clip" data-start="56.74" data-duration="2.55"><span>11월 30일 저녁 7시, 같은 자리</span></div><div id="cap-20" class="cap clip" data-start="59.49" data-duration="2.94"><span>산책하던 한 커플이 누워 있는 남자를 봅니다</span></div><div id="cap-21" class="cap clip" data-start="62.63" data-duration="3.07"><span>그는 오른팔을 쭉 뻗었다가 힘없이 떨어뜨렸죠</span></div><div id="cap-22" class="cap clip" data-start="65.9" data-duration="3.2"><span>가로등이 켜진 뒤에도 그는 꼼짝하지 않았습니다</span></div><div id="cap-23" class="cap clip" data-start="69.3" data-duration="2.42"><span>모기가 달려들어도 반응이 없었죠</span></div><div id="cap-24" class="cap clip" data-start="71.92" data-duration="2.68"><span>다들 술에 취해 잠든 줄로만 알았습니다</span></div><div id="cap-25" class="cap clip" data-start="75.3" data-duration="2.68"><span>부검 결과, 사망 추정 시각은 새벽 2시</span></div><div id="cap-26" class="cap clip" data-start="78.18" data-duration="2.16"><span>마지막 식사는 고기 파이 하나</span></div><div id="cap-27" class="cap clip" data-start="80.54" data-duration="2.94"><span>몸에서는 어떤 독극물도 나오지 않았습니다</span></div><div id="cap-28" class="cap clip" data-start="83.68" data-duration="2.55"><span>그런데도 병리학자는 이렇게 말했죠</span></div><div id="cap-29" class="cap clip" data-start="86.43" data-duration="2.1"><span>"자연사일 리가 없다"</span></div><div id="cap-30" class="cap clip" data-start="89.23" data-duration="3.07"><span>1949년 1월 14일, 애들레이드 기차역</span></div><div id="cap-31" class="cap clip" data-start="92.5" data-duration="3.07"><span>상표가 뜯긴 갈색 여행 가방 하나가 발견됩니다</span></div><div id="cap-32" class="cap clip" data-start="95.77" data-duration="2.94"><span>남자가 죽기 전날 오전에 맡겨진 가방이었죠</span></div><div id="cap-33" class="cap clip" data-start="98.91" data-duration="2.55"><span>그 안에서 나온 주황색 왁스 실 한 타래</span></div><div id="cap-34" class="cap clip" data-start="101.66" data-duration="2.81"><span>남자의 바지를 꿰맨 바로 그 실이었습니다</span></div><div id="cap-35" class="cap clip" data-start="104.67" data-duration="2.42"><span>넥타이엔 'T. 킨'이라는 이름</span></div><div id="cap-36" class="cap clip" data-start="107.29" data-duration="2.68"><span>하지만 그런 실종자는 어디에도 없었죠</span></div><div id="cap-37" class="cap clip" data-start="110.17" data-duration="2.29"><span>그렇다면 T. 킨은 누구였을까</span></div><div id="cap-38" class="cap clip" data-start="113.16" data-duration="2.55"><span>그리고 바지 안쪽의 작은 비밀 주머니</span></div><div id="cap-39" class="cap clip" data-start="115.91" data-duration="2.42"><span>돌돌 말린 종이 한 조각이 나옵니다</span></div><div id="cap-40" class="cap clip" data-start="118.53" data-duration="3.33"><span>인쇄된 단어는 단 두 개, 'Tamám Shud'</span></div><div id="cap-41" class="cap clip" data-start="122.06" data-duration="3.07"><span>페르시아 시집 『루바이야트』의 마지막 구절</span></div><div id="cap-42" class="cap clip" data-start="125.33" data-duration="2.1"><span>뜻은 '끝났다'였습니다</span></div><div id="cap-43" class="cap clip" data-start="128.13" data-duration="3.2"><span>경찰의 공개 호소 뒤, 한 남자가 책을 가져옵니다</span></div><div id="cap-44" class="cap clip" data-start="131.53" data-duration="3.07"><span>마지막 장이 찢겨 나간 바로 그 『루바이야트』</span></div><div id="cap-45" class="cap clip" data-start="134.8" data-duration="2.55"><span>뒤표지엔 눌린 자국으로 남은 글자들</span></div><div id="cap-46" class="cap clip" data-start="137.55" data-duration="2.68"><span>전화번호 하나, 그리고 다섯 줄의 암호</span></div><div id="cap-47" class="cap clip" data-start="140.43" data-duration="2.81"><span>번호의 주인은 해변 근처에 살던 한 간호사</span></div><div id="cap-48" class="cap clip" data-start="143.44" data-duration="2.55"><span>그녀는 이 남자를 모른다고 했습니다</span></div><div id="cap-49" class="cap clip" data-start="146.19" data-duration="3.2"><span>그리고 이 암호는 지금까지도 풀리지 않았습니다</span></div><div id="cap-50" class="cap clip" data-start="149.59" data-duration="2.81"><span>그렇다면 그의 진짜 이름은 무엇이었을까</span></div><div id="cap-51" class="cap clip" data-start="153.1" data-duration="2.81"><span>2021년, 그의 무덤이 다시 열립니다</span></div><div id="cap-52" class="cap clip" data-start="156.11" data-duration="3.07"><span>머리카락에서 얻은 DNA로 먼 친척들을 찾아</span></div><div id="cap-53" class="cap clip" data-start="159.38" data-duration="2.42"><span>가계도를 한 칸씩 거슬러 올라갔죠</span></div><div id="cap-54" class="cap clip" data-start="162.0" data-duration="3.72"><span>2022년 7월, 애들레이드 대학 연구팀이 발표합니다</span></div><div id="cap-55" class="cap clip" data-start="165.92" data-duration="2.1"><span>그의 이름은 칼 '찰스' 웹</span></div><div id="cap-56" class="cap clip" data-start="168.22" data-duration="2.94"><span>1905년생, 멜버른 출신의 전기 기술자</span></div><div id="cap-57" class="cap clip" data-start="171.36" data-duration="3.46"><span>다만 경찰은 아직 이 결과를 공식 확인하지 않았습니다</span></div><div id="cap-58" class="cap clip" data-start="175.52" data-duration="2.94"><span>이름은 돌아왔지만, 질문은 그대로입니다</span></div><div id="cap-59" class="cap clip" data-start="178.66" data-duration="2.68"><span>누가, 왜 옷의 상표를 모두 잘라냈을까</span></div><div id="cap-60" class="cap clip" data-start="181.54" data-duration="2.68"><span>그날 밤, 그에게 무슨 일이 있었던 걸까</span></div><div id="cap-61" class="cap clip" data-start="184.42" data-duration="2.29"><span>대답이라곤 종이 한 조각뿐이죠</span></div><div id="cap-62" class="cap clip" data-start="186.91" data-duration="2.1"><span>타맘 슈드. 끝났다.</span></div>
