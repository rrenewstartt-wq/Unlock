<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gothic A1"; font-weight: 500; src: url("assets/fonts/GothicA1-Medium.ttf"); }
      @font-face { font-family: "Black Han Sans"; font-weight: 400; src: url("assets/fonts/BlackHanSans-Regular.ttf"); }
      :root { --ground: #1E2125; --ink: #E9E5DD; --amber: #F0A23B; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #grain { position: absolute; inset: -200px; z-index: 50; pointer-events: none; opacity: 0.07;
        background-image: url("assets/grain.png"); background-size: 512px 512px; mix-blend-mode: overlay; }
      #vignette { position: absolute; inset: 0; z-index: 51; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.52" data-width="1920" data-height="1080">
      <div id="aerial" data-composition-id="aerial" data-composition-src="compositions/aerial.html" data-start="0.0" data-duration="4.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="approach" data-composition-id="approach" data-composition-src="compositions/approach.html" data-start="4.3" data-duration="3.77" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="macro" data-composition-id="macro" data-composition-src="compositions/macro.html" data-start="8.07" data-duration="3.77" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="follow" data-composition-id="follow" data-composition-src="compositions/follow.html" data-start="11.84" data-duration="3.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="distance" data-composition-id="distance" data-composition-src="compositions/distance.html" data-start="15.74" data-duration="3.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="night" data-composition-id="night" data-composition-src="compositions/night.html" data-start="19.64" data-duration="5.88" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html" data-start="0" data-duration="25.52" data-track-index="10" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:55"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="25.52" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index:60"></div>


    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
